<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Smart Sentence Checker – Ovidhan</title>
<meta content="Check your English sentences for grammar mistakes and get corrections in Bangla." name="description"/>
<link href="/styles.css" rel="stylesheet"/>
<style>
        body { background: var(--bg); color: var(--text); font-family: var(--font-en); }
        .checker-container {
            max-width: 820px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        textarea {
            width: 100%; min-height: 150px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: var(--radius); color: var(--text); padding: 1rem;
            font-size: 1rem; resize: vertical; margin-bottom: 1rem;
        }
        .btn-check {
            background: var(--gold); color: #000; border: none;
            padding: 0.75rem 2rem; border-radius: var(--radius);
            font-weight: 600; cursor: pointer; font-size: 1rem;
        }
        .btn-check:hover { background: #d4a83e; }
        .result-card {
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.5rem; margin-top: 1.5rem;
            display: none;
        }
        .corrected { font-size: 1.2rem; color: var(--green); margin-bottom: 1rem; }
        .explanation { color: var(--text-mid); margin-bottom: 0.75rem; padding-left: 1rem; border-left: 3px solid var(--gold); }
        .example-bn { color: var(--text-soft); font-size: 0.9rem; }
        .no-errors { color: var(--teal); font-weight: 500; }
    </style>
<link href="https://ovidhan.net/tools/sentence-checker.html" hreflang="en" rel="alternate"/><link href="https://ovidhan.net/tools/sentence-checker.html" hreflang="bn" rel="alternate"/><link href="https://ovidhan.net/tools/sentence-checker.html" hreflang="x-default" rel="alternate"/></head>
<body>
<div class="checker-container">
<h1>🧠 Smart Sentence Checker</h1>
<p style="color: var(--text-mid);">Write any English sentence. The checker finds common mistakes and explains them in <strong>Bangla</strong>.</p>
<textarea id="userInput" placeholder="e.g., He go to school yesterday..."></textarea>
<button class="btn-check" onclick="checkSentence()">Check My Sentence</button>
<div class="result-card" id="resultCard">
<div class="corrected" id="correctedSentence"></div>
<div id="explanations"></div>
</div>
<div style="margin-top:2rem; border-top:1px solid var(--border); padding-top:1rem;">
<h3>Common Mistakes We Catch</h3>
<ul style="color: var(--text-mid);">
<li>Subject‑verb agreement</li>
<li>Tense consistency</li>
<li>Banglish errors</li>
<li>Missing articles</li>
</ul>
</div>
</div>
<script>
        const rules = [
            {
                name: "subject_verb_agreement",
                check: (sentence) => {
                    const errors = [];
                    const patterns = [
                        { re: /\bhe (go|do|have|make|run|walk|eat|drink|sleep)\b/gi, fix: (m, v) => `He ${getThirdPerson(v)}` },
                        { re: /\bshe (go|do|have|make|run|walk|eat|drink|sleep)\b/gi, fix: (m, v) => `She ${getThirdPerson(v)}` },
                        { re: /\bit (go|do|have|make|run|walk|eat|drink|sleep)\b/gi, fix: (m, v) => `It ${getThirdPerson(v)}` },
                    ];
                    for (const p of patterns) {
                        let match;
                        while ((match = p.re.exec(sentence)) !== null) {
                            const original = match[0];
                            const verb = match[1];
                            errors.push({
                                original,
                                correction: p.fix(match, verb),
                                explanation_bn: `Third person singular (he/she/it) এর সাথে verb-এর শেষে -s/-es যোগ করতে হয়।`
                            });
                        }
                    }
                    return errors;
                }
            },
            {
                name: "tense_consistency",
                check: (sentence) => {
                    const errors = [];
                    const timeWords = ['yesterday', 'last night', 'last week', 'ago', 'in 2020'];
                    const presentVerbs = /\b(go|do|have|make|run|walk|eat|drink|sleep|see|write|speak)\b/gi;
                    for (const tw of timeWords) {
                        if (sentence.toLowerCase().includes(tw)) {
                            let match;
                            while ((match = presentVerbs.exec(sentence)) !== null) {
                                const verb = match[1];
                                errors.push({
                                    original: match[0],
                                    correction: getPastTense(verb),
                                    explanation_bn: `"${tw}" অতীত সময় নির্দেশ করে, তাই verb-টি past form এ হওয়া উচিত।`
                                });
                            }
                        }
                    }
                    return errors;
                }
            },
            {
                name: "banglish_errors",
                check: (sentence) => {
                    const errors = [];
                    const fixMap = {
                        "i am agree": { correction: "I agree", explanation_bn: `সঠিক ইংরেজি: "I agree"।` },
                        "i am disagree": { correction: "I disagree", explanation_bn: `সঠিক ইংরেজি: "I disagree"।` },
                        "i am understand": { correction: "I understand", explanation_bn: `সঠিক ইংরেজি: "I understand"।` },
                        "i am know": { correction: "I know", explanation_bn: `সঠিক ইংরেজি: "I know"।` },
                    };
                    const lower = sentence.toLowerCase();
                    for (const [wrong, { correction, explanation_bn }] of Object.entries(fixMap)) {
                        if (lower.includes(wrong)) {
                            errors.push({ original: wrong, correction, explanation_bn });
                        }
                    }
                    return errors;
                }
            },
            {
                name: "missing_articles",
                check: (sentence) => {
                    const errors = [];
                    const re = /\b(bought|have|has|want|need|got|get|found|saw|see) (car|book|house|pen|cat|dog|phone)\b/gi;
                    let match;
                    while ((match = re.exec(sentence)) !== null) {
                        errors.push({
                            original: match[0],
                            correction: `${match[1]} a ${match[2]}`,
                            explanation_bn: `Countable singular noun-এর আগে article (a/an) বসাতে হবে।`
                        });
                    }
                    return errors;
                }
            },
        ];

        function getThirdPerson(verb) {
            const map = { go:'goes', do:'does', have:'has', make:'makes', run:'runs', walk:'walks', eat:'eats', drink:'drinks', sleep:'sleeps' };
            return map[verb.toLowerCase()] || verb+'s';
        }

        function getPastTense(verb) {
            const map = { go:'went', do:'did', have:'had', make:'made', run:'ran', walk:'walked', eat:'ate', drink:'drank', sleep:'slept', see:'saw', write:'wrote', speak:'spoke' };
            return map[verb.toLowerCase()] || verb+'ed';
        }

        function checkSentence() {
            const input = document.getElementById('userInput').value.trim();
            const resultCard = document.getElementById('resultCard');
            const correctedDiv = document.getElementById('correctedSentence');
            const explanationsDiv = document.getElementById('explanations');
            if (!input) { resultCard.style.display = 'none'; return; }
            let workingSentence = input;
            const allErrors = [];
            for (const rule of rules) {
                const errors = rule.check(workingSentence);
                allErrors.push(...errors);
                for (const error of errors) {
                    workingSentence = workingSentence.replace(error.original, error.correction);
                }
            }
            if (allErrors.length === 0) {
                correctedDiv.innerHTML = `<span class="no-errors">✅ No common mistakes found!</span>`;
                explanationsDiv.innerHTML = '';
            } else {
                correctedDiv.innerHTML = `<strong>Corrected:</strong> ${workingSentence}`;
                let expHtml = '';
                for (const err of allErrors) {
                    expHtml += `<div class="explanation">❌ <s>${err.original}</s> → ✅ ${err.correction}<br><span class="example-bn">${err.explanation_bn}</span></div>`;
                }
                explanationsDiv.innerHTML = expHtml;
            }
            resultCard.style.display = 'block';
        }
    </script>
</body>
</html>
